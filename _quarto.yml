project:
  type: website
  output-dir: docs
  # copied into docs/ on every render so GitHub Pages doesn't run Jekyll over it
  resources:
    - .nojekyll
  render:
    - index.qmd
    - how-it-works.qmd
    - events.qmd
    - recipes.qmd
    - join.qmd
    - about.qmd
    - 404.qmd
    # only the individual event posts. events.qmd is the single events index,
    # so the old nested posts/event/index.qmd is deliberately not rendered
    - posts/event/photo/*/index.qmd
  # Old drafts from a different project, kept on disk but not published:
  #   science.qmd, Chicche.qmd, tech.qmd, tutorials.qmd, jobs.qmd

website:
  title: "Cuochi senza fuochi"
  description: "A free club in Padova for making desserts and easy recipes together, without an oven and without a kitchen."
  site-url: "https://fdeloscogna.github.io/cuochi-senza-fuochi/"
  favicon: images/logo.jpg
  open-graph: true
  twitter-card: true

  navbar:
    # the logo is a wide script wordmark, illegible at navbar height,
    # so it lives in the homepage hero instead and the navbar uses text
    title: "Cuochi senza fuochi"
    pinned: false
    left:
      - text: "Home"
        href: index.qmd
      - text: "How it works"
        href: how-it-works.qmd
      - text: "Sessions"
        href: events.qmd
      - text: "Recipes"
        href: recipes.qmd
      - text: "How it started"
        href: about.qmd
    right:
      # social icons before the CTA so "Join in" stays the last, rightmost thing
      - icon: instagram
        href: https://www.instagram.com/cuochi_senza_fuochi/
        aria-label: "Cuochi senza fuochi on Instagram"
      - icon: tiktok
        href: https://www.tiktok.com/@cuochi_senza_fuochi
        aria-label: "Cuochi senza fuochi on TikTok"
      - icon: youtube
        href: https://www.youtube.com/@cuochisenzafuochi
        aria-label: "Cuochi senza fuochi on YouTube"
      - text: "Join in"
        href: join.qmd

  page-footer:
    left: |
      **Cuochi senza fuochi.** Desserts made without a kitchen, in Padova.
      Free, monthly, since March 2022.
    center:
      - text: "How it works"
        href: how-it-works.qmd
      - text: "Sessions"
        href: events.qmd
      - text: "Recipes"
        href: recipes.qmd
      - text: "Join in"
        href: join.qmd
      - text: "How it started"
        href: about.qmd
    right:
      - icon: instagram
        href: https://www.instagram.com/cuochi_senza_fuochi/
        aria-label: "Instagram"
      - icon: tiktok
        href: https://www.tiktok.com/@cuochi_senza_fuochi
        aria-label: "TikTok"
      - icon: youtube
        href: https://www.youtube.com/@cuochisenzafuochi
        aria-label: "YouTube"

format:
  html:
    theme: cosmo
    # plain CSS, loaded after the Bootstrap theme (not an scss layer)
    css: styles.css
    # Quarto otherwise builds <title> as "page title EN-DASH site title".
    # Every pagetitle below already names the club, and we want no dashes anywhere.
    title-prefix: ""
    toc: false
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    grid:
      body-width: 1140px
