project:
  type: website
  output-dir: docs
  # copied into docs/ on every render so GitHub Pages doesn't run Jekyll over it
  resources:
    - .nojekyll
    # the auto synced social feed, fetched at run time by latest.qmd.
    # scripts/sync-latest-content.mjs writes both this and the docs/ copy, so the
    # sync workflow never needs to render the site.
    - data/latest-content.json
    # only referenced from styles.css (the round navbar emblem), so Quarto
    # would not otherwise know to copy it
    - images/logo-wordmark.jpg
    # hand-picked videos (sweet guests, who we are in a minute) for the Videos page
    - data/videos-curated.json
    # recipe and guest photos, saved from our Instagram posts. Listed because the
    # recipe cards are raw HTML and the guest photo is only referenced from JSON.
    - images/recipes/*.jpg
    - images/guests/*.jpg
  render:
    - index.qmd
    - how-it-works.qmd
    - events.qmd
    - recipes.qmd
    - latest.qmd
    - join.qmd
    - about.qmd
    - cities.qmd
    - 404.qmd
    # only the individual event posts. events.qmd is the single events index,
    # so the old nested posts/event/index.qmd is deliberately not rendered
    - posts/event/photo/*/index.qmd
    # the Italian copies. English is the main site; the "Italiano" button in the
    # navbar (see _includes/site.html) switches to the same page in it/.
    - it/*.qmd
  # Old drafts from a different project, kept on disk but not published:
  #   science.qmd, Chicche.qmd, tech.qmd, tutorials.qmd, jobs.qmd

website:
  title: "Cuochi senza fuochi"
  description: "A group of people who make cheap, easy desserts together to meet new people. No oven, no skills, no competition. Started in Padova, open to every city."
  site-url: "https://fdeloscogna.github.io/cuochi-senza-fuochi/"
  favicon: images/logo.jpg
  open-graph: true
  twitter-card: true

  navbar:
    # the logo is a wide script wordmark, illegible at navbar height, so the
    # navbar uses text plus the round emblem, cropped out of the wordmark in CSS
    # (.navbar-brand::before in styles.css)
    title: "Cuochi senza fuochi"
    pinned: false
    # Default is lg (992px). Between there and roughly 1250px the brand, the
    # links, the three social icons, the CTA and the search box do not fit on one
    # row, and the overflow was silently clipping whichever item fell past the
    # edge. Collapsing to the burger below 1200px removes that cramped range.
    collapse-below: xl
    left:
      # No "Home": the brand already links there. Sessions lives in the footer
      # and in the calls to action, to keep the bar uncrowded.
      - text: "Who we are"
        href: about.qmd
      - text: "How it works"
        href: how-it-works.qmd
      - text: "Recipes"
        href: recipes.qmd
      - text: "Your city"
        href: cities.qmd
      - text: "Videos"
        href: latest.qmd
    right:
      # the language switch. _includes/site.html finds it by this href and points
      # it at the same page in the other language.
      - text: "Italiano"
        icon: translate
        href: it/index.qmd
      # social icons before the CTA so "Join us" stays the last, rightmost thing
      - icon: instagram
        href: https://www.instagram.com/cuochi_senza_fuochi/
        aria-label: "Cuochi senza fuochi on Instagram"
      - icon: tiktok
        href: https://www.tiktok.com/@cuochi_senza_fuochi
        aria-label: "Cuochi senza fuochi on TikTok"
      - icon: youtube
        href: https://www.youtube.com/@cuochisenzafuochi
        aria-label: "Cuochi senza fuochi on YouTube"
      - text: "Join us"
        href: join.qmd

  page-footer:
    left: |
      **Cuochi senza fuochi.** Easy desserts, made together, to meet new people.
      Started in Padova in March 2022, open to any city.
    center:
      - text: "Who we are"
        href: about.qmd
      - text: "How it works"
        href: how-it-works.qmd
      - text: "Recipes"
        href: recipes.qmd
      - text: "Sessions"
        href: events.qmd
      - text: "Videos"
        href: latest.qmd
      - text: "Your city"
        href: cities.qmd
      - text: "Join us"
        href: join.qmd
    right:
      - icon: instagram
        href: https://www.instagram.com/cuochi_senza_fuochi/
        aria-label: "Instagram"
      - icon: tiktok
        href: https://www.tiktok.com/@cuochi_senza_fuochi
        aria-label: "TikTok"
      - icon: youtube
        href: https://www.youtube.com/@cuochisenzafuochi
        aria-label: "YouTube"

format:
  html:
    theme: cosmo
    # plain CSS, loaded after the Bootstrap theme (not an scss layer)
    css: styles.css
    # language switch and the Videos page script, shared by every page
    include-after-body: _includes/site.html
    # Quarto otherwise builds <title> as "page title EN-DASH site title".
    # Every pagetitle below already names the club, and we want no dashes anywhere.
    title-prefix: ""
    toc: false
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    grid:
      body-width: 1140px
